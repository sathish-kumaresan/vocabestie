<!-- SPEAK Exercise: Say the Swedish word (New MediaRecorder-based) -->
<div class="exercise-content">
    <!-- Skill badge -->
    <div class="flex justify-center mb-4">
        <span class="px-3 py-1 bg-dark-card rounded-full text-sm text-gray-400">
            🗣️ Speak
        </span>
    </div>

    <!-- Question -->
    <div class="text-center mb-6">
        <p class="text-gray-400 mb-2">Say this word</p>
        <div class="flex items-center justify-center gap-3 mb-2">
            <h2 class="text-4xl font-bold text-white">{{ exercise.swedish }}</h2>
            <button id="play-native-btn" onclick="playNativeAudio()"
                class="text-gray-400 hover:text-swedish-yellow p-2 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>
        <p class="text-gray-500">{{ exercise.english }}</p>
    </div>

    <!-- Score Gauge (hidden until result) -->
    <div id="score-section" class="hidden mb-6">
        <div class="score-gauge relative w-28 h-28 mx-auto">
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#333" stroke-width="8" />
                <circle id="score-arc" cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="8"
                    stroke-dasharray="283" stroke-dashoffset="283" transform="rotate(-90 50 50)"
                    class="transition-all duration-1000" />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <span id="score-value" class="text-2xl font-bold">--</span>
                <span class="text-sm">%</span>
            </div>
        </div>
        <p id="score-label" class="text-center mt-2 text-gray-400 text-sm"></p>
    </div>

    <!-- Level Meter (during recording) -->
    <div id="level-meter-section" class="hidden mb-4 px-8">
        <div class="h-3 bg-dark-border rounded-full overflow-hidden">
            <div id="level-bar"
                class="h-full bg-gradient-to-r from-green-500 via-yellow-500 to-red-500 transition-all duration-75"
                style="width: 0%"></div>
        </div>
        <p class="text-xs text-gray-500 text-center mt-1">
            Recording: <span id="recording-time">0.0</span>s
        </p>
    </div>

    <!-- Microphone button -->
    <div class="flex flex-col items-center">
        <button id="mic-btn"
            class="bg-swedish-blue hover:bg-blue-600 text-white p-6 rounded-full transition-all transform hover:scale-105 shadow-lg relative">
            <span id="mic-ripple"
                class="absolute inset-0 rounded-full bg-red-500 opacity-75 animate-ping hidden"></span>
            <svg id="mic-icon" class="w-12 h-12 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        <p id="mic-status" class="text-gray-400 text-sm mt-3 font-medium">Tap to record</p>
    </div>

    <!-- Playback Controls (after recording) -->
    <div id="playback-section" class="hidden mt-4">
        <div class="flex justify-center gap-4">
            <button id="play-user-btn" onclick="playUserRecording()"
                class="text-sm text-swedish-blue hover:text-blue-400 flex items-center gap-1">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                Your recording
            </button>
            <button onclick="playNativeAudio()"
                class="text-sm text-swedish-yellow hover:text-yellow-400 flex items-center gap-1">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                Native audio
            </button>
        </div>
    </div>

    <!-- Result feedback -->
    <div id="result-section" class="hidden mt-4 text-center">
        <p id="result-text" class="text-lg font-medium"></p>
        <p id="heard-text" class="text-sm text-gray-500 mt-1"></p>

        <!-- Syllable Feedback -->
        <div id="syllables-container" class="flex flex-wrap justify-center gap-2 mt-3"></div>
    </div>

    <!-- Action buttons (after result) -->
    <div id="action-section" class="hidden mt-6 flex justify-center gap-4">
        <button id="retry-btn" onclick="resetExercise()"
            class="px-4 py-2 bg-dark-card hover:bg-gray-700 rounded-lg text-gray-300">
            Try Again
        </button>
        <button id="continue-btn" onclick="submitAndContinue()"
            class="px-4 py-2 bg-swedish-blue hover:bg-blue-600 rounded-lg text-white">
            Continue
        </button>
    </div>

    <!-- Skip button -->
    <div class="text-center mt-6">
        <button onclick="skipExercise()" class="text-gray-500 hover:text-gray-400 text-sm">
            Can't use microphone? Skip →
        </button>
    </div>

    <!-- Hidden data -->
    <input type="hidden" id="word-id" value="{{ exercise.word_id }}">
    <input type="hidden" id="skill-type" value="speak">
    <input type="hidden" id="expected-word" value="{{ exercise.swedish }}">
</div>

<script>
    (function () {
        // Elements
        const micBtn = document.getElementById('mic-btn');
        const micRipple = document.getElementById('mic-ripple');
        const micStatus = document.getElementById('mic-status');
        const levelSection = document.getElementById('level-meter-section');
        const levelBar = document.getElementById('level-bar');
        const recordingTime = document.getElementById('recording-time');
        const scoreSection = document.getElementById('score-section');
        const playbackSection = document.getElementById('playback-section');
        const resultSection = document.getElementById('result-section');
        const resultText = document.getElementById('result-text');
        const heardText = document.getElementById('heard-text');
        const actionSection = document.getElementById('action-section');

        const expectedWord = document.getElementById('expected-word').value;
        const wordId = document.getElementById('word-id').value;

        let recordingStartTime = null;
        let timerInterval = null;
        let lastScore = 0;
        let lastTranscript = '';

        // Initialize
        if (!Pronunciation.isSupported()) {
            micStatus.textContent = 'Recording not supported in this browser';
            micBtn.disabled = true;
            micBtn.classList.add('opacity-50');
            return;
        }
        Pronunciation.init();

        // Mic button click
        micBtn.addEventListener('click', async () => {
            if (Pronunciation.isRecording) {
                await stopAndAnalyze();
            } else {
                await startRecording();
            }
        });

        async function startRecording() {
            // Reset UI
            scoreSection.classList.add('hidden');
            playbackSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            actionSection.classList.add('hidden');

            const success = await Pronunciation.startRecording((level) => {
                levelBar.style.width = `${level}%`;
            });

            if (success) {
                // Update UI to recording state
                micBtn.classList.remove('bg-swedish-blue', 'hover:bg-blue-600');
                micBtn.classList.add('bg-red-600', 'hover:bg-red-700');
                micRipple.classList.remove('hidden');
                micStatus.textContent = 'Recording... Tap to stop';
                micStatus.className = 'text-red-400 text-sm mt-3 font-medium';
                levelSection.classList.remove('hidden');

                // Start timer
                recordingStartTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = ((Date.now() - recordingStartTime) / 1000).toFixed(1);
                    recordingTime.textContent = elapsed;
                }, 100);
            }
        }

        async function stopAndAnalyze() {
            // Stop timer
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // Reset button UI
            micBtn.classList.add('bg-swedish-blue', 'hover:bg-blue-600');
            micBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
            micRipple.classList.add('hidden');
            levelSection.classList.add('hidden');
            micStatus.textContent = 'Analyzing...';
            micStatus.className = 'text-gray-400 text-sm mt-3 font-medium';

            // Stop recording
            const blob = await Pronunciation.stopRecording();

            if (!blob) {
                showResult(0, '', 'No audio captured');
                return;
            }

            // Check if there's actual audio
            const hasAudio = await Pronunciation.hasAudioContent(blob);
            if (!hasAudio) {
                showResult(0, '', 'No speech detected. Try speaking louder.');
                return;
            }

            // Show playback controls
            playbackSection.classList.remove('hidden');

            // Send to server for analysis
            await analyzeOnServer(blob);
        }

        async function analyzeOnServer(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');
            formData.append('word_id', wordId);
            formData.append('tier', '2'); // Request server STT analysis

            try {
                const response = await fetch('/api/speech/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    lastTranscript = data.transcription || '';
                    lastScore = data.score || 0;
                    showResult(lastScore, lastTranscript, data.feedback, data.syllables);
                } else {
                    // Fallback to basic analysis
                    showResult(50, '', 'Server analysis unavailable. Basic check passed.');
                }
            } catch (err) {
                console.error('Analysis failed:', err);
                // Fallback - assume partial success if audio was detected
                showResult(50, '', 'Could not verify pronunciation. Try again.');
            }
        }

        function showResult(score, transcript, feedback, syllables) {
            lastScore = score;
            lastTranscript = transcript;

            // Update score gauge
            AudioVisualizer.updateScoreGauge(score);

            // Show syllables if available
            if (syllables) {
                AudioVisualizer.displaySyllables('syllables-container', syllables);
            } else {
                document.getElementById('syllables-container').innerHTML = '';
            }

            scoreSection.classList.remove('hidden');

            // Update result text
            if (score >= 70) {
                resultText.textContent = feedback || 'Good job!';
                resultText.className = 'text-lg font-medium text-green-400';
            } else if (score >= 40) {
                resultText.textContent = feedback || 'Keep practicing';
                resultText.className = 'text-lg font-medium text-yellow-400';
            } else {
                resultText.textContent = feedback || 'Try again';
                resultText.className = 'text-lg font-medium text-red-400';
            }

            if (transcript) {
                heardText.textContent = `Heard: "${transcript}"`;
                heardText.classList.remove('hidden');
            } else {
                heardText.classList.add('hidden');
            }

            resultSection.classList.remove('hidden');
            actionSection.classList.remove('hidden');

            micStatus.textContent = 'Tap mic to try again';
            micStatus.className = 'text-gray-400 text-sm mt-3 font-medium';
        }

        window.playNativeAudio = function () {
            TTS.speak(expectedWord);
        };

        window.playUserRecording = function () {
            Pronunciation.playUserRecording();
        };

        window.resetExercise = function () {
            scoreSection.classList.add('hidden');
            playbackSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            actionSection.classList.add('hidden');
            micStatus.textContent = 'Tap to record';
            micStatus.className = 'text-gray-400 text-sm mt-3 font-medium';
        };

        window.submitAndContinue = function () {
            const isCorrect = lastScore >= 70;

            fetch('/learn/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word_id: parseInt(wordId),
                    skill_type: 'speak',
                    answer: lastTranscript || expectedWord
                })
            })
                .then(res => res.json())
                .then(() => {
                    window.location.reload();
                })
                .catch(() => {
                    window.location.reload();
                });
        };

        window.skipExercise = function () {
            fetch('/learn/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word_id: parseInt(wordId),
                    skill_type: 'speak',
                    answer: ''
                })
            }).finally(() => {
                window.location.reload();
            });
        };
    })();
</script>
