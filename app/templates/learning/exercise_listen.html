<div class="exercise-content">
    <!-- Skill badge -->
    <div class="flex justify-center mb-4">
        <span class="px-3 py-1 bg-dark-card rounded-full text-sm text-gray-400">
            👂 Listen
        </span>
    </div>

    <!-- Question -->
    <div class="text-center mb-8">
        <p class="text-gray-400 mb-4">Listen and select the meaning</p>
        <button onclick="playAudio()" id="play-btn" class="bg-swedish-blue hover:bg-blue-700 text-white p-6 rounded-full transition-colors">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
        </button>
        <p class="text-gray-500 text-sm mt-2">Tap to play</p>
    </div>

    <!-- Options -->
    <div class="space-y-3" id="options-container">
        {% for option in exercise.options %}
        <button onclick="selectOption(this, '{{ option }}')"
                class="option-btn w-full bg-dark-card hover:bg-gray-800 border-2 border-dark-border hover:border-swedish-blue text-white font-medium py-4 px-6 rounded-xl transition-all text-left">
            {{ option }}
        </button>
        {% endfor %}
    </div>

    <input type="hidden" id="word-id" value="{{ exercise.word_id }}">
    <input type="hidden" id="skill-type" value="{{ exercise.skill_type }}">
    <input type="hidden" id="swedish-word" value="{{ exercise.swedish }}">
</div>

<script>
// Auto-play on load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(playAudio, 500);
});

function playAudio() {
    const word = document.getElementById('swedish-word').value;
    TTS.speak(word, {lang: 'sv-SE'});
}

function selectOption(button, answer) {
    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-gray-800', 'hover:border-swedish-blue');
    });
    button.classList.add('border-swedish-yellow', 'bg-gray-800');

    const wordId = document.getElementById('word-id').value;
    const skillType = document.getElementById('skill-type').value;
    submitAnswer(parseInt(wordId), skillType, answer);
}
</script>
