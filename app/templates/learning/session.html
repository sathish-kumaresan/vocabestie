{% extends "base.html" %}

{% block title %}Learning - {{ scenario.name }}{% endblock %}

{% block content %}
<div class="p-4 max-w-md mx-auto" id="session-container" data-word-ids="{{ word_ids | join(',') }}"
    data-current-index="{{ current_index }}" data-total-words="{{ total_words }}" data-scenario-id="{{ scenario.id }}"
    data-correct-count="0">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <a href="/scenarios/{{ scenario.id }}" class="text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </a>
        <div class="flex items-center gap-2">
            <span class="text-white font-medium" id="progress-text">1 / {{ total_words }}</span>
        </div>
        <div class="w-6"></div>
    </div>

    <!-- Progress bar -->
    <div class="w-full bg-dark-border rounded-full h-2 mb-6">
        <div class="bg-swedish-yellow h-2 rounded-full transition-all duration-300" id="progress-bar"
            style="width: {{ (1 / total_words * 100) | int }}%"></div>
    </div>

    <!-- Exercise container -->
    <div id="exercise-container">
        <!-- Initial exercise will be rendered here -->
    </div>
</div>

<script>
    // Session data - tracks learning session state and timing
    const sessionData = {
        wordIds: document.getElementById('session-container').dataset.wordIds.split(',').map(Number),
        currentIndex: parseInt(document.getElementById('session-container').dataset.currentIndex),
        totalWords: parseInt(document.getElementById('session-container').dataset.totalWords),
        scenarioId: parseInt(document.getElementById('session-container').dataset.scenarioId),
        correctCount: 0,
        currentExercise: null,
        startTime: Date.now(),
    };

    // Load initial exercise
    document.addEventListener('DOMContentLoaded', function () {
        loadExercise(sessionData.wordIds[0]);
    });

    function updateProgress() {
        const percent = ((sessionData.currentIndex + 1) / sessionData.totalWords) * 100;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').textContent = (sessionData.currentIndex + 1) + ' / ' + sessionData.totalWords;
    }

    function loadExercise(wordId) {
        fetch('/learn/exercise/' + wordId + '?word_ids=' + sessionData.wordIds.join(',') + '&current_index=' + sessionData.currentIndex)
            .then(response => response.text())
            .then(html => {
                document.getElementById('exercise-container').innerHTML = html;

                // Extract and store exercise data from hidden fields
                const wordIdEl = document.getElementById('word-id');
                const skillTypeEl = document.getElementById('skill-type');

                if (wordIdEl && skillTypeEl) {
                    sessionData.currentExercise = {
                        wordId: parseInt(wordIdEl.value),
                        skillType: skillTypeEl.value,
                    };

                    // Initialize exercise based on type
                    initializeExercise(skillTypeEl.value);
                }
            });
    }

    function initializeExercise(skillType) {
        if (skillType === 'listen') {
            // Auto-play audio after a short delay
            setTimeout(function () {
                playAudio();
            }, 500);
        } else if (skillType === 'write') {
            // Initialize letter tiles
            initWriteExercise();
        } else if (skillType === 'speak') {
            initSpeakExercise();
        }
    }

    function nextExercise() {
        sessionData.currentIndex++;

        if (sessionData.currentIndex >= sessionData.totalWords) {
            // Session complete - calculate elapsed time in seconds
            const elapsedSeconds = Math.round((Date.now() - sessionData.startTime) / 1000);
            window.location.href = '/learn/complete?scenario_id=' + sessionData.scenarioId +
                '&words_practiced=' + sessionData.totalWords +
                '&correct_count=' + sessionData.correctCount +
                '&time_seconds=' + elapsedSeconds;
            return;
        }

        updateProgress();
        loadExercise(sessionData.wordIds[sessionData.currentIndex]);
    }

    function submitAnswer(wordId, skillType, answer) {
        fetch('/learn/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                word_id: wordId,
                skill_type: skillType,
                answer: answer
            })
        })
            .then(response => response.json())
            .then(data => {
                showFeedback(data.correct, data.message, data.correct_answer);
                if (data.correct) {
                    sessionData.correctCount++;
                }
            });
    }

    function showFeedback(correct, message, correctAnswer) {
        const container = document.getElementById('exercise-container');
        const feedbackHtml = `
        <div class="text-center py-8">
            <div class="text-6xl mb-4">${correct ? '✓' : '✗'}</div>
            <p class="text-2xl font-bold ${correct ? 'text-green-500' : 'text-red-500'} mb-2">${correct ? 'Correct!' : 'Incorrect'}</p>
            ${!correct ? '<p class="text-gray-400 mb-4">Correct answer: <span class="text-white font-medium">' + correctAnswer + '</span></p>' : ''}
            <button onclick="nextExercise()" class="mt-6 bg-swedish-blue hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-colors">
                Continue
            </button>
        </div>
    `;
        container.innerHTML = feedbackHtml;
    }

    // ============ READ & LISTEN EXERCISE FUNCTIONS ============
    function selectOption(button, answer) {
        // Disable all options
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.disabled = true;
            btn.classList.remove('hover:bg-gray-800', 'hover:border-swedish-blue');
        });

        // Highlight selected
        button.classList.add('border-swedish-yellow', 'bg-gray-800');

        // Submit answer
        submitAnswer(sessionData.currentExercise.wordId, sessionData.currentExercise.skillType, answer);
    }

    // ============ LISTEN EXERCISE FUNCTIONS ============
    function playAudio() {
        speakSwedishWord();
    }

    // Generic function to speak the Swedish word (used by read, listen, speak exercises)
    function speakSwedishWord() {
        const swedishWord = document.getElementById('swedish-word');
        if (swedishWord && typeof TTS !== 'undefined') {
            TTS.speak(swedishWord.value, { lang: 'sv-SE' });
        }
    }

    // ============ SPEAK EXERCISE FUNCTIONS ============

    function initSpeakExercise() {
        console.log("initSpeakExercise called");
        const micBtn = document.getElementById('mic-btn');
        if (micBtn) {
            console.log("mic-btn found, attaching handler");
            micBtn.onclick = function () {
                console.log("Mic button clicked. State:", Speech.isRecording);
                if (Speech.isRecording) {
                    Speech.stop();
                } else {
                    Speech.start();
                }
            };
        } else {
            console.warn("mic-btn NOT found");
        }
        // Update UI based on current state (in case it carried over)
        if (Speech.isRecording) {
            handleSpeechStart();
        }
    }

    // Global Speech Event Listeners (Registered once)
    window.addEventListener('speech_start', handleSpeechStart);
    window.addEventListener('speech_end', handleSpeechEnd);
    window.addEventListener('speech_no_result', handleSpeechNoResult);
    window.addEventListener('speech_result', handleSpeechResult);
    window.addEventListener('speech_error', handleSpeechError);

    function handleSpeechStart() {
        const micBtn = document.getElementById('mic-btn');
        const micRipple = document.getElementById('mic-ripple');
        const micStatus = document.getElementById('mic-status');
        const resultContainer = document.getElementById('result-container');

        if (micBtn) {
            micBtn.classList.remove('bg-swedish-blue', 'hover:bg-blue-600');
            micBtn.classList.add('bg-red-600', 'hover:bg-red-700');
        }
        if (micRipple) micRipple.classList.remove('hidden');
        if (micStatus) {
            micStatus.textContent = "Listening...";
            micStatus.classList.add('text-red-400');
            micStatus.classList.remove('text-green-500', 'text-orange-500');
        }
        if (resultContainer) resultContainer.classList.add('hidden');
    }

    function handleSpeechEnd() {
        const micBtn = document.getElementById('mic-btn');
        const micRipple = document.getElementById('mic-ripple');

        if (micBtn) {
            micBtn.classList.add('bg-swedish-blue', 'hover:bg-blue-600');
            micBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
        }
        if (micRipple) micRipple.classList.add('hidden');
    }

    function handleSpeechNoResult() {
        const micStatus = document.getElementById('mic-status');
        if (micStatus) {
            micStatus.textContent = "Didn't hear anything. Try again?";
            micStatus.className = "text-md font-medium text-yellow-500";
        }
    }

    function handleSpeechError(e) {
        const micStatus = document.getElementById('mic-status');
        if (micStatus) {
            micStatus.textContent = e.detail.message;
            micStatus.classList.add('text-red-400');
        }
    }

    function handleSpeechResult(e) {
        // Only process if we are currently looking at a speak exercise
        if (!document.getElementById('mic-btn')) return;

        try {
            const transcript = e.detail.transcript;
            const confidence = e.detail.confidence;
            const expected = document.getElementById('expected-word').value;
            const micStatus = document.getElementById('mic-status');
            const transcriptDisplay = document.getElementById('transcript-text');
            const resultContainer = document.getElementById('result-container');

            if (micStatus) {
                micStatus.textContent = "Processing...";
                micStatus.classList.remove('text-red-400');
            }

            if (transcriptDisplay) {
                transcriptDisplay.innerHTML = `<span class="text-gray-400 text-xs">Heard:</span> <span class="text-white">"${transcript}"</span>`;
                if (confidence < 0.8) {
                    transcriptDisplay.innerHTML += ` <span class="text-yellow-500 text-xs" title="Low confidence">(?)</span>`;
                }
            }
            if (resultContainer) resultContainer.classList.remove('hidden');

            // Validation Logic
            const normalize = (str) => str ? str.toLowerCase().replace(/[.,!?]/g, '').trim() : '';
            const tNorm = normalize(transcript);
            const eNorm = normalize(expected);

            console.log(`STT Check: "${tNorm}" vs "${eNorm}"`);

            let isMatch = tNorm === eNorm;

            // 1. Phonetic/English Fallback Map (Hack for Browser STT bias)
            // Common misinterpretations of Swedish words by English-biased STT
            const phoneticMap = {
                'fot': ['foot', 'fought', 'fuck', 'hot', 'thought'],
                'hjälp': ['help', 'yelp', 'help help', 'alp'],
                'hej': ['hey', 'hay', 'hi'],
                'ja': ['ya', 'yeah', 'yah'],
                'nej': ['nay', 'neigh', 'no'],
                'bra': ['bruh', 'bro', 'brah'],
                'i': ['e', 'ee', 'in', 'it', 'eye', 'aye', 'high', 'ih', 'eh'],
                'på': ['poor', 'paw', 'po', 'paul'],
                'att': ['at', 'that'],
                'och': ['ok', 'oak', 'oh'],
                'en': ['an', 'n', 'and'],
                'ett': ['at', 'et', 'it'],
                'vi': ['v', 'we', 've'],
                'ni': ['knee', 'ne'],
                'de': ['the', 'they', 'day'],
                'inte': ['into', 'inter'],
                'har': ['hard', 'her', 'hair'],
                'kan': ['can', 'con', 'khan'],
                'vill': ['will', 'wheel', 'ville'],
                'ska': ['scau', 'score'],
                'nu': ['new', 'knew', 'nu'],
                'här': ['hair', 'here', 'her'],
                'där': ['their', 'there', 'dare'],
            };

            if (!isMatch && phoneticMap[eNorm]) {
                if (phoneticMap[eNorm].includes(tNorm)) {
                    console.log(`STT: Phonetic match found! "${tNorm}" -> "${eNorm}"`);
                    isMatch = true;
                }
            }

            // 2. Levenshtein Distance for small typos (allow 1-2 char diff)
            if (!isMatch) {
                const dist = levenshtein(tNorm, eNorm);
                // Allow distance of 1 for words length > 2
                // Allow distance of 2 for words length > 5
                const allowed = eNorm.length > 5 ? 2 : (eNorm.length > 2 ? 1 : 0);
                if (dist <= allowed) {
                    isMatch = true;
                }
            }

            // 3. Containment (with length safeguard)
            if (!isMatch && tNorm && eNorm) {
                if ((tNorm.includes(eNorm) || eNorm.includes(tNorm)) && Math.abs(tNorm.length - eNorm.length) <= 3) {
                    isMatch = true;
                }
            }

            if (isMatch) {
                if (micStatus) {
                    micStatus.textContent = "Correct!";
                    micStatus.className = "text-xl font-bold text-green-500 animate-bounce";
                }
                setTimeout(() => {
                    // word_id, skill_type, answer
                    submitAnswer(parseInt(document.getElementById('word-id').value), 'speak', transcript);
                }, 1000);
            } else {
                if (micStatus) {
                    micStatus.textContent = "Not quite. Try again.";
                    micStatus.className = "text-md font-bold text-orange-500";
                }
            }
        } catch (err) {
            console.error("Validation Error:", err);
        }
    }

    // Levenshtein helper
    function levenshtein(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
        for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function skipExercise() {
        // Submit empty answer to skip
        if (sessionData.currentExercise) {
            submitAnswer(sessionData.currentExercise.wordId, sessionData.currentExercise.skillType, '');
        }
    }

    // ============ WRITE EXERCISE FUNCTIONS ============
    let selectedLetters = [];

    function initWriteExercise() {
        selectedLetters = [];
        updateAnswerDisplay();
    }

    function selectLetter(button, letter) {
        if (button.classList.contains('opacity-30')) return;

        selectedLetters.push(letter);
        button.classList.add('opacity-30');
        button.disabled = true;

        updateAnswerDisplay();
    }

    function updateAnswerDisplay() {
        const display = document.getElementById('current-answer');
        if (display) {
            display.textContent = selectedLetters.join('');
        }
    }

    function clearAnswer() {
        selectedLetters = [];
        document.querySelectorAll('.letter-tile').forEach(tile => {
            tile.classList.remove('opacity-30');
            tile.disabled = false;
        });
        updateAnswerDisplay();
    }

    function checkWriteAnswer() {
        const answer = selectedLetters.join('');
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) submitBtn.disabled = true;

        submitAnswer(sessionData.currentExercise.wordId, sessionData.currentExercise.skillType, answer);
    }

    function showHint() {
        const correctAnswer = document.getElementById('correct-answer');
        if (correctAnswer) {
            const firstTwo = correctAnswer.value.substring(0, 2);
            alert('Hint: The word starts with "' + firstTwo + '..."');
        }
    }
</script>
{% endblock %}
