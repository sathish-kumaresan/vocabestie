services:
  db:
    image: postgres:16-alpine
    container_name: vocabestie-db
    environment:
      POSTGRES_USER: vocabestie
      POSTGRES_PASSWORD: vocabestie
      POSTGRES_DB: vocabestie
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabestie"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
